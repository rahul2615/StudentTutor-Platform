{% extends 'base.html' %}

{% block title %}404 Page Not Found — EduConnect{% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 550px; margin: 3rem auto; padding: 3rem 2rem;">
    <div class="empty-state-icon" style="background-color: var(--primary-light); color: var(--primary);">
        <i class="fas fa-compass"></i>
    </div>
    <h1 style="font-size: 3.5rem; margin-bottom: 0.5rem; color: var(--primary);">404</h1>
    <h3 class="empty-state-title">Page Not Found</h3>
    <p class="empty-state-desc">
        We couldn't find the page or resource you were looking for. It might have been moved or deleted.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
        <a href="{{ url_for('home.index') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> Back to Home
        </a>
        <button onclick="history.back();" class="btn btn-outline">
            <i class="fas fa-arrow-left"></i> Go Back
        </button>
    </div>
</div>
{% endblock %}
