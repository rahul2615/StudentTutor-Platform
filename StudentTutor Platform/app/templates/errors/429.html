{% extends 'base.html' %}

{% block title %}429 Too Many Requests — EduConnect{% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 550px; margin: 3rem auto; padding: 3rem 2rem;">
    <div class="empty-state-icon" style="background-color: var(--warning-light); color: var(--warning);">
        <i class="fas fa-hourglass-half"></i>
    </div>
    <h1 style="font-size: 3rem; margin-bottom: 0.5rem; color: var(--warning);">429</h1>
    <h3 class="empty-state-title">Too Many Requests</h3>
    <p class="empty-state-desc">
        You've sent too many requests in a short period. Please wait a moment and try again.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
        <a href="{{ url_for('home.index') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> Back to Home
        </a>
        <button onclick="history.back()" class="btn btn-outline">
            <i class="fas fa-arrow-left"></i> Go Back
        </button>
    </div>
</div>
{% endblock %}
