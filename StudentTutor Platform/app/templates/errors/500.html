{% extends 'base.html' %}

{% block title %}500 Server Error — EduConnect{% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 550px; margin: 3rem auto; padding: 3rem 2rem;">
    <div class="empty-state-icon" style="background-color: var(--warning-light); color: var(--warning);">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <h1 style="font-size: 3.5rem; margin-bottom: 0.5rem; color: var(--warning);">500</h1>
    <h3 class="empty-state-title">Server Error</h3>
    <p class="empty-state-desc">
        Something went wrong on our end. Our team has been notified and is working to resolve it. Please try again in a few moments.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
        <a href="{{ url_for('home.index') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="javascript:location.reload();" class="btn btn-outline">
            <i class="fas fa-redo"></i> Refresh Page
        </a>
    </div>
</div>
{% endblock %}
